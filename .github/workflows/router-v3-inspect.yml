name: Router v3 integration inspect

on:
  push:
    branches: [ci/windows-self-hosted]
    paths:
      - .github/workflows/router-v3-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/windows-self-hosted
          fetch-depth: 1
      - name: Locate current app-server schema generator
        shell: bash
        run: |
          set -euo pipefail
          echo '=== JUST RECIPES ==='
          grep -RIn -E -C 5 'app.server.*schema|schema.*app.server|write.*schema|generate.*schema' justfile codex-rs/justfile .github 2>/dev/null | head -n 1200 || true
          echo '=== RUST SOURCES ==='
          grep -RIn -E -C 8 'write_schema|write.*schema|generate_schema|generate.*schema|schema_fixtures|export.*schema|JsonSchema' codex-rs/app-server codex-rs/app-server-protocol codex-rs/app-server-interface codex-rs/cli 2>/dev/null | head -n 2000 || true
          echo '=== BIN TARGETS / MANIFESTS ==='
          grep -RIn -E -C 5 '^\[\[bin\]\]|^name = .*schema|schema.*bin|schema.*path' codex-rs/*/Cargo.toml | head -n 1600 || true
          echo '=== FILE NAMES ==='
          find codex-rs -type f \( -iname '*schema*' -o -iname '*export*' \) | sort | head -n 1000
