name: Router v3 integration inspect

on:
  push:
    branches: [ci/windows-self-hosted]
    paths:
      - .github/workflows/router-v3-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/windows-self-hosted
          fetch-depth: 1
      - name: Locate TUI route plumbing
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AUTO ROUTE GLOBAL ==='
          grep -RIn -E -C 18 'AutoModelRoute|auto_model_route' codex-rs/tui/src || true
          echo '=== MODEL SELECTION GLOBAL ==='
          grep -RIn -E -C 12 'ModelSelectionChanged|model_selection' codex-rs/tui/src | head -n 900 || true
          echo '=== SLASH GLOBAL ==='
          grep -RIn -E -C 14 'SlashCommand::Model|SlashCommand::Status|SlashCommand::DebugConfig' codex-rs/tui/src | head -n 1200 || true
