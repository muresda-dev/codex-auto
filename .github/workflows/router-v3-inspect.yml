name: Router v3 integration inspect

on:
  push:
    branches: [ci/windows-self-hosted]
    paths:
      - .github/workflows/router-v3-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/windows-self-hosted
          fetch-depth: 1
      - name: Locate route state and slash dispatch
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AUTO ROUTE OCCURRENCES ==='
          grep -n -E -C 20 'auto_model_route' codex-rs/tui/src/chatwidget.rs || true
          echo '=== MODEL SELECTION OCCURRENCES ==='
          grep -n -E -C 12 'ModelSelectionChanged|model_selection' codex-rs/tui/src/chatwidget.rs | head -n 500 || true
          echo '=== SLASH COMMAND HANDLER DEFINITIONS ==='
          grep -n -E -C 12 'fn .*slash|handle_.*slash|dispatch_.*slash|SlashCommand::' codex-rs/tui/src/chatwidget.rs | head -n 1200 || true
          echo '=== CORE RESOLVER TAIL ==='
          sed -n '868,930p' codex-rs/core/src/session/turn_context.rs
