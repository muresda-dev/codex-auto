name: Apply exec model selection fix

on:
  push:
    branches:
      - ci/windows-self-hosted
    paths:
      - .github/workflows/patch-exec-model-selection.yml

permissions:
  contents: write

jobs:
  patch:
    name: Patch codex-exec and clean up helper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ci/windows-self-hosted
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source fix and push
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/exec/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          newline = '\r\n' if '\r\n' in text else '\n'
          needle = f"                        model: None,{newline}                        service_tier: None,"
          replacement = (
              f"                        model: None,{newline}"
              f"                        model_selection: None,{newline}"
              f"                        service_tier: None,"
          )

          count = text.count(needle)
          if count != 1:
              raise SystemExit(
                  f'Expected exactly one TurnStartParams model/service_tier sequence, found {count}.'
              )

          path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='')
          Path('.github/workflows/patch-exec-model-selection.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- codex-rs/exec/src/lib.rs .github/workflows/patch-exec-model-selection.yml
          git diff --cached --check
          git commit -m 'fix(exec): initialize turn model selection'
          git push origin HEAD:ci/windows-self-hosted
