name: Auto router upstream port

on:
  push:
    branches:
      - sync/auto-model-router-v2
    paths:
      - .github/workflows/auto-router-upstream-port.yml

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/auto-model-router-v2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Port legacy integration onto current upstream
        shell: bash
        run: |
          set -euxo pipefail

          # Apply the original integration but keep current upstream hunks when
          # both sides touched the same code. The router itself was already
          # rewritten as v2 and must stay on the current branch.
          git cherry-pick --no-commit -X ours 483e6aad287c9b9d999816d11ecb532f217004ac
          git restore --source=HEAD -- codex-rs/core/src/model_router.rs codex-rs/core/src/model_router_tests.rs codex-rs/core/src/lib.rs
          # lib.rs only needs the module registration from the legacy commit.
          python - <<'PY'
          from pathlib import Path
          p = Path('codex-rs/core/src/lib.rs')
          s = p.read_text()
          needle = 'mod mcp_tool_exposure;\n'
          if 'mod model_router;\n' not in s:
              s = s.replace(needle, needle + 'mod model_router;\n')
          p.write_text(s)
          PY
          git add -A
          git commit -m "feat(auto): port model-selection integration to refreshed upstream"

          # Keep only meaningful follow-up fixes/tests. Deliberately skip the
          # temporary working-directory assertion commits and old generated
          # schema artifacts; schemas are regenerated from current sources.
          git cherry-pick -X ours bfe283c5f18e8b476121ec98ef1adbb1f060cb3e
          git cherry-pick -X ours 0c3026e3d2a3ad56cbe239d841835ccd05fc8880
          git cherry-pick -X ours aa4d91fe75f6d50a1b0c04565b75ddefa6056f5b
          git cherry-pick -X ours 2d1b5cd39f748cc06e25df56c896b1b2fc2ca4c5

      - name: Regenerate current app-server schemas
        shell: bash
        run: |
          set -euxo pipefail
          cd codex-rs
          cargo run -p codex-app-server-protocol --bin write_schema_fixtures
          cd ..
          git add codex-rs/app-server-protocol/schema || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): regenerate app-server schemas on current upstream"
          fi

      - name: Format
        shell: bash
        run: |
          set -euxo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(auto): format upstream port"
          fi

      - name: Push ported branch
        run: git push origin HEAD:sync/auto-model-router-v2

      - name: Check core router tests
        working-directory: codex-rs
        run: cargo test -p codex-core model_router --lib

      - name: Check affected crates
        working-directory: codex-rs
        run: cargo check -p codex-core -p codex-app-server -p codex-tui
