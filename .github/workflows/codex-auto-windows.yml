name: Codex Auto Windows

on:
  push:
    branches:
      - ci/windows-self-hosted
  workflow_dispatch:

concurrency:
  group: codex-auto-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTUP_HOME: C:\Rust\rustup
  CARGO_HOME: C:\Rust\cargo
  CARGO_TARGET_DIR: C:\codex-build\target
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Test, build and package x64
    runs-on: [self-hosted, Windows, X64, codex-auto, windows-x64]
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print runner specs
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ramGiB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 1)
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($computer.NumberOfLogicalProcessors)"
          Write-Host "RAM: $ramGiB GiB"
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize Name, @{Name='FreeGiB';Expression={[math]::Round($_.Free / 1GB, 1)}}

      - name: Validate installed tools
        run: |
          git --version
          python --version
          rustc --version
          cargo --version
          rustup --version

          $iscc = Get-ChildItem `
            'C:\Program Files\Inno Setup *\ISCC.exe', `
            'C:\Program Files (x86)\Inno Setup *\ISCC.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            throw 'ISCC.exe (Inno Setup) was not found.'
          }
          Write-Host "Inno Setup: $($iscc.FullName)"

      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt
          rustup component add clippy
          rustc --version

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure rusty_v8 prebuilt artifact
        run: |
          $target = 'x86_64-pc-windows-msvc'
          $profile = 'ptrcomp_sandbox_release'
          $version = (& python "$env:GITHUB_WORKSPACE\.github\scripts\rusty_v8_bazel.py" resolved-v8-crate-version).Trim()
          if (-not $version) {
            throw 'Could not resolve rusty_v8 crate version.'
          }

          $releaseTag = "rusty-v8-v$version"
          $baseUrl = "https://github.com/openai/codex/releases/download/$releaseTag"
          $bindingDir = Join-Path $env:RUNNER_TEMP 'rusty_v8'
          New-Item -ItemType Directory -Force $bindingDir | Out-Null

          $archiveName = "rusty_v8_${profile}_${target}.lib.gz"
          $bindingName = "src_binding_${profile}_${target}.rs"
          $checksumsName = "rusty_v8_${profile}_${target}.sha256"

          $archivePath = Join-Path $bindingDir $archiveName
          $bindingPath = Join-Path $bindingDir $bindingName
          $checksumsPath = Join-Path $bindingDir $checksumsName

          Invoke-WebRequest "$baseUrl/$archiveName" -OutFile $archivePath
          Invoke-WebRequest "$baseUrl/$bindingName" -OutFile $bindingPath
          Invoke-WebRequest "$baseUrl/$checksumsName" -OutFile $checksumsPath

          $checksumLines = @(Get-Content $checksumsPath | Where-Object { $_.Trim() })
          if ($checksumLines.Count -ne 2) {
            throw "Expected exactly 2 rusty_v8 checksums, got $($checksumLines.Count)."
          }

          foreach ($line in $checksumLines) {
            $parts = $line.Trim() -split '\s+', 2
            if ($parts.Count -ne 2) {
              throw "Invalid checksum line: $line"
            }
            $expected = $parts[0].ToLowerInvariant()
            $fileName = ($parts[1] -replace '^\*', '').Trim()
            $filePath = Join-Path $bindingDir $fileName
            if (-not (Test-Path $filePath)) {
              throw "Checksum target not found: $filePath"
            }
            $actual = (Get-FileHash -Algorithm SHA256 $filePath).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $fileName"
            }
            Write-Host "Verified $fileName"
          }

          "RUSTY_V8_ARCHIVE=$archivePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTY_V8_SRC_BINDING_PATH=$bindingPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --config imports_granularity=Item --check

      - name: Test Auto model router
        run: cargo test -p codex-core model_router --lib

      - name: Check affected crates
        run: cargo check -p codex-core -p codex-app-server -p codex-tui

      - name: Build Windows release binaries
        run: |
          $env:LIBSQLITE3_FLAGS = 'SQLITE_DISABLE_INTRINSIC'
          cargo build `
            --target x86_64-pc-windows-msvc `
            --release `
            --bin codex `
            --bin codex-code-mode-host `
            --bin codex-responses-api-proxy `
            --bin codex-windows-sandbox-setup `
            --bin codex-command-runner `
            --bin codex-app-server

      - name: Stage Windows binaries
        run: |
          $releaseDir = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'
          $stageDir = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-x64'
          New-Item -ItemType Directory -Force $stageDir | Out-Null

          $binaries = @(
            'codex',
            'codex-code-mode-host',
            'codex-responses-api-proxy',
            'codex-windows-sandbox-setup',
            'codex-command-runner',
            'codex-app-server'
          )

          foreach ($binary in $binaries) {
            $source = Join-Path $releaseDir "$binary.exe"
            if (-not (Test-Path $source)) {
              throw "Expected release binary missing: $source"
            }
            Copy-Item $source (Join-Path $stageDir "$binary.exe") -Force
            $sizeMiB = [math]::Round((Get-Item $source).Length / 1MB, 1)
            Write-Host "$binary.exe - $sizeMiB MiB"
          }

      - name: Build Codex Auto installer
        working-directory: .
        run: |
          $iscc = Get-ChildItem `
            'C:\Program Files\Inno Setup *\ISCC.exe', `
            'C:\Program Files (x86)\Inno Setup *\ISCC.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            throw 'ISCC.exe was not found.'
          }

          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-x64'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'dist\installer'
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $appVersion = "0.0.0-auto.$env:GITHUB_RUN_NUMBER"
          & $iscc.FullName `
            "/DAppVersion=$appVersion" `
            "/DBuildDir=$buildDir" `
            "/DOutputDir=$outputDir" `
            "$env:GITHUB_WORKSPACE\installer\codex-auto.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = Join-Path $outputDir 'Codex-Auto-Setup-x64.exe'
          if (-not (Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }
          $sizeMiB = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Installer: $setup ($sizeMiB MiB)"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: codex-auto-windows-x64-${{ github.run_number }}
          path: |
            dist/installer/Codex-Auto-Setup-x64.exe
            dist/windows-x64/*.exe
          if-no-files-found: error
          retention-days: 14
