name: Repair Router v3 finalizer

on:
  push:
    branches: [ci/windows-self-hosted]
    paths:
      - .github/workflows/router-v3-repair-finalizer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/windows-self-hosted
          fetch-depth: 0
          persist-credentials: true

      - name: Repair finalizer and just recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          finalizer = Path('.github/workflows/router-v3-finalize.yml')
          text = finalizer.read_text(encoding='utf-8')
          old = '''      - name: Regenerate app-server protocol schemas
        shell: bash
        working-directory: codex-rs
        run: cargo run -p codex-app-server --bin codex-write-app-server-schema
'''
          new = '''      - name: Regenerate app-server protocol schemas
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          python3 app-server-protocol/scripts/write_schema_fixtures.py
          python3 app-server-protocol/scripts/write_schema_fixtures.py --experimental
'''
          if text.count(old) != 1:
              raise SystemExit(f'finalizer schema step: expected one match, got {text.count(old)}')
          finalizer.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          justfile = Path('justfile')
          text = justfile.read_text(encoding='utf-8')
          old = '''write-app-server-schema *args:
    cargo run -p codex-app-server-protocol --bin write_schema_fixtures -- {args}
'''
          new = '''write-app-server-schema *args:
    {{python}} app-server-protocol/scripts/write_schema_fixtures.py {args}
'''
          if text.count(old) != 1:
              raise SystemExit(f'justfile schema recipe: expected one match, got {text.count(old)}')
          justfile.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          Path('.github/workflows/router-v3-repair-finalizer.yml').unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(auto): use current app-server schema generator'
          git push origin HEAD:ci/windows-self-hosted
